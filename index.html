/* V3.1: Muokkaus + heti päivittyvä riskimatriisin esikatselu */

<script>
'use strict';
const STORAGE='jatkuvuus_haltuun_v3', LEGACY='jatkuvuus_demo_v1';

 ['Varmista tavoite ja osallistujat ennen työpajaa.','Valitse asiakkaalle sopiva lähtöpohja ja hyväksytä oletukset vasta yhdessä asiakkaan kanssa.','Varaa lopuksi riittävästi aikaa vastuiden ja jatkotoimien sopimiseen.'],
 ['Mistä yrityksen liiketoiminta ja asiakkaalle syntyvä arvo muodostuvat?','Mitkä toiminnot on pakko palauttaa ensin?','Milloin keskeytyksestä tulee liiketoiminnalle merkittävä?','Kirjaa vain merkittävimmät toiminnot nyt; täydentää voi myöhemmin.'],

const $=s=>document.querySelector(s);

function makeSample(template='industry',name='Mallitehdas Oy'){

 const actions=template==='industry'?[{id:'a1',title:'ERP-varamenettely ja palautusharjoitus',owner:'IT-päällikkö',due:'2026-11-30',status:'Käynnissä',verified:false,resource:'ERP-järjestelmä',riskIds:[],mechanism:'impact',reduction:40,cost:5000,priority:'Heti',description:'Yhteinen varamenettely tilaus-toimitukselle ja varastonhallinnalle.'},{id:'a2',title:'Varavoiman toteutettavuusselvitys',owner:'Tuotantopäällikkö',due:'2026-12-15',status:'Suunniteltu',verified:false,resource:'Sähkönjakelu',riskIds:[],mechanism:'recovery',reduction:55,cost:'',priority:'Heti',description:'Selvitetään varavoiman kapasiteetti ja toteutusaika.'}]:[];
 return {version:3,company:{name,industry:template,description:'Kuvitteellinen esimerkkiasiakas – lähtötiedot vahvistetaan työpajassa.'},workshop:{date:new Date().toISOString().slice(0,10),facilitator:'Vakuutusyhtiön riskienhallinta-asiantuntija',participants:'Toimitusjohtaja, tuotantopäällikkö',duration:145,objective:'Tunnistetaan keskeiset jatkuvuusriskit ja sovitaan tärkeimmistä kehittämistoimenpiteistä.',conclusions:'',openItems:'',status:'Valmistelussa',closedAt:''},functions:fs,risks,actions,nextRiskNo:risks.length+1};

function exposures(){const rows=[...db.risks.map(r=>({...r}))];const resources=[...new Set(db.risks.map(r=>r.resource).filter(Boolean))];for(const resource of resources){
 const matches=db.risks.filter(r=>r.resource===resource);const source=[...matches].sort((a,b)=>b.prob*impact(b)-a.prob*impact(a))[0];const funcs=db.functions.filter(f=>f.deps.includes(resource)&&!db.risks.some(r=>r.fid===f.id&&r.resource===resource));funcs.forEach((f,i)=>rows.push({...source,id:'derived:'+f.id+':'+resource,sourceNo:source.no,suffix:String.fromCharCode(65+i),fid:f.id,derived:true,event:'Arvioitu riippuvuus: '+resource}));
 }return rows;

function actionTargets(a,r){if(a.resource)return a.resource===r.resource&&!!fn(r.fid)?.deps.includes(a.resource);return !r.derived&&(a.riskIds||[]).includes(r.id)}
function metrics(r,mode='current'){let p=Number(r.prob)||1,i=impact(r),hours=Math.max(0,Number(r.recoveryHours)||24);const applied=db.actions.filter(a=>actionTargets(a,r)&&(mode==='plan'||(mode==='completed'&&a.status==='Valmis'&&a.verified)));for(const a of applied){const k=1-clamp(a.reduction,0,100)/100;if(a.mechanism==='likelihood')p*=k;else if(a.mechanism==='recovery')hours*=k;else i*=k;}return {p:clamp(Math.round(p),1,5),i:clamp(Math.round(i),1,5),hours:Math.round(hours*10)/10,score:Math.round(p*i*100)/100};}

 const w=930,h=Math.max(280,Math.max(resources.length,fs.length)*49+90);const fy=i=>56+i*(h-110)/Math.max(1,fs.length-1),ry=i=>56+i*(h-110)/Math.max(1,resources.length-1);let lines='',left='',right='';fs.forEach((f,i)=>{left+=`<circle class="fn" cx="175" cy="${fy(i)}" r="16"/><text x="165" y="${fy(i)-24}" text-anchor="middle">${esc(f.name.slice(0,29))}</text>`;f.deps.forEach(res=>{const j=resources.indexOf(res);if(j>=0)lines+=`<line class="${ui.selectedRes===res?'hit':''}" x1="191" y1="${fy(i)}" x2="712" y2="${ry(j)}"/>`})});resources.forEach((r,j)=>{const n=fs.filter(f=>f.deps.includes(r)).length;right+=`<g data-resource="${esc(r)}" tabindex="0" role="button"><circle class="${n>1?'hot':'res'}" cx="730" cy="${ry(j)}" r="${n>1?18:14}"/><text x="753" y="${ry(j)+4}">${esc(r.slice(0,25))} (${n})</text></g>`});return `<svg viewBox="0 0 ${w} ${h}" class="network" role="img" aria-label="Kriittisten toimintojen ja resurssien riippuvuusverkosto"><text x="26" y="19">TOIMINNOT</text><text x="711" y="19">RESURSSIT</text>${lines}${left}${right}</svg>`}

function newRisk(fid,resource){const id='r'+Date.now()+'_'+Math.floor(Math.random()*9999),no=db.nextRiskNo||Math.max(1,...db.risks.map(r=>r.no+1));const r={id,no,fid:fid||db.functions[0]?.id||'',resource:resource||'',event:'Uusi keskeytystapahtuma',trigger:'',effect:'',replace:'',severity:2,replaceScore:2,prob:3,readiness:1,recoveryHours:24};db.nextRiskNo=no+1;db.risks.push(r);ui.selectedRisk=id;return r}
function pageRisks(){const selected=risk(ui.selectedRisk)||db.risks[0];if(selected)ui.selectedRisk=selected.id;const q=templates[db.company.industry]?.questions||[];return `${guide()}<div class="card"><div class="toolbar space"><div><h2>3. Keskeytystapahtumat</h2><p class="muted small">Valitse skenaario ja muokkaa tietoja alemmassa laatikossa. Voit kirjata toimenpiteen jo riskin arvioinnin yhteydessä.</p></div><button class="btn" id="addRisk">+ Lisää skenaario</button></div><div class="tablewrap"><table><thead><tr><th>Nro</th><th>Keskeytystapahtuma</th><th>Kriittinen toiminto</th><th>Resurssi</th><th>Nykyinen riskitaso</th></tr></thead><tbody>${db.risks.map(r=>`<tr tabindex="0" role="button" class="clickable ${r.id===ui.selectedRisk?'selected':''}" data-select-risk="${esc(r.id)}"><td><b>${riskCode(r)}</b></td><td>${esc(r.event)}</td><td>${esc(fn(r.fid)?.name||'–')}</td><td>${esc(r.resource)}</td><td>${badge(metrics(r).p*metrics(r).i)}</td></tr>`).join('')}</tbody></table></div></div>${selected?`<div class="card"><div class="toolbar space"><h2>Muokkaa ${riskCode(selected)}: ${esc(selected.event)}</h2><button class="btn danger smallbtn" id="deleteRisk">Poista skenaario</button></div>${ui.pendingDeleteRisk===selected.id?`<div class="risk-delete-confirm" role="group" aria-label="Vahvista skenaarion poistaminen"><strong>Poistetaanko ${riskCode(selected)} – ${esc(selected.event)}?</strong><p class="small">Skenaario poistetaan analyysistä ja sen kytkennät kehittämistoimenpiteisiin irrotetaan. Varsinaiset toimenpiteet säilyvät sivulla 5.</p><div class="toolbar"><button class="btn danger" id="confirmDeleteRisk">Vahvista poisto</button><button class="btn secondary" id="cancelDeleteRisk">Peruuta</button></div></div>`:''}<div class="grid two">${form('Kriittinen toiminto',sel('risk',selected.id,'fid',selected.fid,db.functions.map(f=>[f.id,f.name])))}${form('Resurssi / riippuvuus',`<input data-kind="risk" data-id="${selected.id}" data-key="resource" list="resources" value="${esc(selected.resource)}"><datalist id="resources">${listRes().map(r=>`<option value="${esc(r)}">`).join('')}</datalist>`)}${form('Keskeytystapahtuma',inp('risk',selected.id,'event',selected.event))}${form('Aiheuttaja',inp('risk',selected.id,'trigger',selected.trigger))}${form('Vaikutus liiketoimintaan',ta('risk',selected.id,'effect',selected.effect,2))}${form('Vaihtoehtoinen toimintatapa / korvattavuus',ta('risk',selected.id,'replace',selected.replace,2))}</div><div class="divider"></div><h3>Riskin ja nykyisen varautumisen arviointi</h3><div class="grid two">${form('Vakavuus',sel('risk',selected.id,'severity',selected.severity,[[1,'1 – Vähäinen'],[2,'2 – Merkittävä'],[3,'3 – Vakava']]))}${form('Korvattavuuden heikkous',sel('risk',selected.id,'replaceScore',selected.replaceScore,[[1,'1 – Helppo korvata'],[2,'2 – Osittain korvattava'],[3,'3 – Vaikea korvata']]))}${form('Todennäköisyys',sel('risk',selected.id,'prob',selected.prob,[[1,'1 – Erittäin epätodennäköinen'],[2,'2 – Epätodennäköinen'],[3,'3 – Mahdollinen'],[4,'4 – Todennäköinen'],[5,'5 – Erittäin todennäköinen']]))}${form('Nykyinen varautuminen',sel('risk',selected.id,'readiness',selected.readiness,[[1,'1 – Puutteellinen'],[2,'2 – Osittainen'],[3,'3 – Hyvä']]))}${form('Arvioitu palautumisaika (h)',inp('risk',selected.id,'recoveryHours',selected.recoveryHours,'number','min="1" max="8760"'))}</div><div class="info"><b>Riskimatriisin nykyinen sijainti:</b> Todennäköisyys ${metrics(selected).p} × vaikutus ${metrics(selected).i}. ${badge(metrics(selected).p*metrics(selected).i)}. Vaikutus muodostuu vakavuuden, korvattavuuden ja nykyisen varautumisen perusteella.</div><button class="btn" id="actionForRisk">+ Kirjaa kehittämisidea tähän riskiin</button>${(()=>{const ideas=db.actions.filter(a=>(a.riskIds||[]).includes(selected.id)||(a.resource&&a.resource===selected.resource));return ideas.length?`<div class="idea-editor" id="riskIdeas"><h3>Kehittämisideat tähän riskiin (${ideas.length})</h3><p class="small muted">Kirjoita idea ja mahdolliset tarkennukset tähän. Teksti tallentuu samalla myös sivun 5 toimenpiteeseen.</p>${ideas.map(a=>`<div class="idea-entry">${form('Kehittämisidean nimi',inp('action',a.id,'title',a.title))}${form('Kuvaus / tarkentavat huomiot',ta('action',a.id,'description',a.description||'',2))}<div class="idea-actions"><span class="small muted">${a.reduction?esc(a.reduction)+' % arvioitu vaikutus':'Vaikutusta ei vielä arvioitu'}</span><button class="btn secondary smallbtn" data-go-action="${esc(a.id)}">Täydennä kehittämissivulla →</button></div></div>`).join('')}</div>`:`<p class="small muted">Kirjaa syntyvä idea heti. Se tallentuu sivulle 5 täydennettäväksi eikä muuta nykytilan riskimatriisia.</p>`})()}</div>`:'<div class="empty">Lisää ensimmäinen riskiskenaario.</div>'}<div class="card"><h2>Toimialakohtaisia keskusteluavauksia</h2><div class="chips">${q.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><p class="small muted">Kysymykset ovat ehdotuksia. Havaitut riskit ja vaikutukset vahvistetaan yhdessä asiakkaan kanssa.</p></div>`}
function matrix(mode='current',ids=true){const modes={current:'Nykyinen riskikuva',completed:'Todennettujen toimenpiteiden jälkeen',plan:'Kaikkien suunniteltujen toimien jälkeen'};const rows=[5,4,3,2,1],cols=[1,2,3,4,5];const names={1:'Erittäin epätodennäköinen',2:'Epätodennäköinen',3:'Mahdollinen',4:'Todennäköinen',5:'Erittäin todennäköinen'};const data={};for(const p of rows)for(const i of cols)data[p+'-'+i]=[];exposures().forEach(r=>{const m=metrics(r,mode);data[m.p+'-'+m.i].push(r)});return `<div><h3>${modes[mode]}</h3><table class="riskmat"><thead><tr><th class="ylabel">Todennäköisyys</th><th class="ynum"></th><th colspan="5">Vaikutuspisteet</th></tr><tr><th class="ylabel"></th><th class="ynum"></th>${cols.map(i=>`<th>${i}</th>`).join('')}</tr></thead><tbody>${rows.map(p=>`<tr><th class="ylabel">${names[p]}</th><th class="ynum">${p}</th>${cols.map(i=>`<td class="riskcell m${p+i-1}"><div class="risknumbers">${data[p+'-'+i].map(r=>`<button class="riskpin" title="${esc(riskCode(r)+' – '+r.event)}" data-inspect-risk="${esc(r.id)}">${riskCode(r)}</button>`).join('')}</div></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function timeImpact(){const r=risk(ui.timeRisk)||db.risks[0];if(!r)return '';ui.timeRisk=r.id;const f=fn(r.fid);const labels=[4,8,24,72,168],levelAt=t=>{let y;if(!f)y=Math.min(5,Math.ceil(t/24));else if(t<=4)y=f.impact4||1;else if(t<=24)y=(f.impact4||1)+(f.impact24-f.impact4)*(t-4)/20;else if(t<=72)y=f.impact24+(f.impact72-f.impact24)*(t-24)/48;else y=f.impact72;return clamp(Math.round(y*10)/10,1,5)};return `<div class="card"><h2>Keskeytymisen vaikutus ajan funktiona</h2><p class="small muted">Toiminnon työpajassa arvioitu BIA-vaikutus suhteutetaan keskeytyksen kestoon. Tämä on havainnollistava indeksi, ei euromääräinen vahinkoennuste.</p>${form('Keskeytysskenaario',`<select id="timeRisk">${options(r.id,db.risks.map(x=>[x.id,riskCode(x)+' – '+x.event]))}</select>`)}<div class="grid two"><div class="metric">Toiminnon RTO<b>${f?.rto||'–'} h</b></div><div class="metric">Skenaarion arvioitu palautuminen<b>${r.recoveryHours||'–'} h</b></div></div><div class="timeline">${labels.map(t=>{const val=levelAt(t);return `<div class="timecol"><div class="timebar" style="height:${Math.round(val/5*145)}px;background:${val>=4?'#ca6956':val>=3?'#e5ad43':'#4a9390'}"></div><small>${t>=24?t/24+' vrk':t+' h'}</small></div>`}).join('')}</div><div class="info">Vaikutusarvot perustuvat kriittisen toiminnon sivulla 1 tehtyyn arvioon. Palautumisaikaa voidaan tarkentaa kullekin skenaariolle sivulla 3.</div></div>`}
function riskImpactTable(){const xs=exposures();return `<div class="tablewrap"><table><thead><tr><th>Nro</th><th>Keskeytys ja toiminto</th><th>Nykytila</th><th>Todennetut</th><th>Tavoitetila</th><th>Palautuminen nyt → tavoitteessa</th></tr></thead><tbody>${xs.map(r=>{const a=metrics(r),b=metrics(r,'completed'),c=metrics(r,'plan');return `<tr><td><b>${riskCode(r)}</b></td><td>${esc(r.event)}<div class="small muted">${esc(fn(r.fid)?.name||'–')} ${r.derived?'· laskennallinen riippuvuus':''}</div></td><td>${a.p} × ${a.i}</td><td>${b.p} × ${b.i}</td><td>${c.p} × ${c.i}</td><td>${a.hours} h → ${c.hours} h</td></tr>`}).join('')}</tbody></table></div>`}
function pageOverview(){const xs=exposures(),counts={high:0,mid:0,low:0};xs.forEach(r=>counts[tier(metrics(r).p*metrics(r).i)]++);const focus=xs.find(x=>x.id===ui.focusRisk);const sorted=[...xs].sort((a,b)=>(metrics(b).p*metrics(b).i)-(metrics(a).p*metrics(a).i));return `${guide()}<div class="grid"><div class="metric">Korkean riskitason skenaariot<b>${counts.high}</b></div><div class="metric">Keskitason skenaariot<b>${counts.mid}</b></div><div class="metric">Matalan tason skenaariot<b>${counts.low}</b></div></div><div class="card"><h2>4. Nykyinen riskitilanne</h2><p class="muted small">Tämä vaihe kuvaa vain tällä hetkellä arvioitua riskiä ja nykyistä varautumista. Kehittämistoimia tai niiden oletettuja vaikutuksia <b>ei</b> huomioida tässä matriisissa. Riskinumeroita voi klikata tarkempiin tietoihin.</p>${matrix('current')}<div class="matrixkey"><span><i class="swatch m2"></i>Vähäisempi</span><span><i class="swatch m5"></i>Seurattava</span><span><i class="swatch m7"></i>Merkittävä</span><span><i class="swatch m9"></i>Vakava</span></div>${focus?`<div class="info"><b>${riskCode(focus)} – ${esc(focus.event)}</b><br>Kriittinen toiminto: ${esc(fn(focus.fid)?.name||'–')} · Resurssi: ${esc(focus.resource)} ${focus.derived?'· Laskennallinen riippuvuus':''}<div class="toolbar" style="margin-top:8px">${!focus.derived?`<button class="btn smallbtn" data-open-risk="${focus.id}">Muokkaa skenaariota</button>`:''}<button class="btn smallbtn secondary" id="closeRiskInspect">Sulje</button></div></div>`:''}<h3>Riskien tunnisteet</h3><div class="risklegend">${xs.map(r=>`<div class="legenditem"><b>${riskCode(r)}</b> – ${esc(r.event)} <span class="muted">(${esc(fn(r.fid)?.name||'–')})</span>${r.derived?'<span class="pill mid">laskennallinen</span>':''}</div>`).join('')}</div><div class="warning">Automaattisesti päätellyt resurssiriippuvuudet on merkitty laskennallisiksi, eivätkä ne ole asiakkaan vahvistamia riskihavaintoja. Arviointimalli on havainnollistava.</div></div><div class="card"><h2>Merkittävimmät keskeytysriskit – nykytila</h2><div class="tablewrap"><table><thead><tr><th>Nro</th><th>Keskeytystapahtuma</th><th>Toiminto</th><th>Nykyinen riski</th><th>Arvioitu palautumisaika</th></tr></thead><tbody>${sorted.map(r=>{const m=metrics(r);return `<tr><td><b>${riskCode(r)}</b></td><td>${esc(r.event)}${r.derived?' <span class="pill mid">laskennallinen</span>':''}</td><td>${esc(fn(r.fid)?.name||'–')}</td><td>${badge(m.p*m.i)}</td><td>${m.hours} h</td></tr>`}).join('')}</tbody></table></div><div class="info"><b>Seuraava vaihe:</b> Sivulla 5 täydennetään kehittämisideat, verrataan varautumisvaihtoehtoja ja tarkastellaan, miten riskimatriisi muuttuu toimenpiteiden seurauksena. <button class="btn secondary smallbtn" data-nav="5">Siirry kehittämiseen →</button></div></div>${timeImpact()}`}
function addAction(riskId='',resource=''){let a={id:'a'+Date.now()+'_'+Math.floor(Math.random()*9999),title:riskId?'Varautumistoimenpide: '+(risk(riskId)?.event||'Uusi riski'):resource?'Varautumisen parantaminen: '+resource:'Uusi varautumistoimenpide',owner:'',due:'',status:'Suunniteltu',verified:false,resource,riskIds:riskId?[riskId]:[],mechanism:'impact',reduction:0,cost:'',priority:'Seuraavaksi',description:riskId?'Työpajassa kirjattu kehittämisidea. Vaikutus, vastuu ja aikataulu täydennetään sivulla 5.':''};db.actions.push(a);ui.selectedAction=a.id;return a}
function actionMatrixPreview(){const mode=ui.matrix||'current';const xs=exposures(),focus=xs.find(x=>x.id===ui.focusRisk);return `<h2>Toimenpiteiden vaikutus riskimatriisiin</h2><p class="small muted">Muuta vasemmalla toimenpiteen kohdistusta, vaikutusprosenttia tai vaikutusmekanismia. Vertaa sen jälkeen nykytilaa, todennettuja toimia ja suunniteltua tavoitetilaa.</p><div class="modebar">${[['current','Nykytila'],['completed','Todennetut'],['plan','Tavoitetila']].map(([key,label])=>`<button class="btn smallbtn ${key===mode?'current':'secondary'}" data-matrix="${key}">${label}</button>`).join('')}</div>${matrix(mode)}<div class="matrixkey"><span><i class="swatch m2"></i>Vähäisempi</span><span><i class="swatch m5"></i>Seurattava</span><span><i class="swatch m7"></i>Merkittävä</span><span><i class="swatch m9"></i>Vakava</span></div><div class="workshop-indexes">${[['current','Nykytila'],['completed','Todennetut'],['plan','Tavoitetila']].map(([k,label])=>`<div class="snapshot ${k===mode?'focusmode':''}"><span class="tiny muted">${label}</span><b>${total(k)}</b></div>`).join('')}</div>${focus?`<div class="info"><b>${riskCode(focus)} – ${esc(focus.event)}</b><br>${esc(fn(focus.fid)?.name||'–')} · ${focus.derived?'Laskennallinen riippuvuus':'Arvioitu skenaario'} <div class="toolbar" style="margin-top:8px">${!focus.derived?`<button class="btn smallbtn" data-open-risk="${focus.id}">Muokkaa riskiä</button>`:''}<button class="btn smallbtn secondary" id="closeRiskInspect">Sulje</button></div></div>`:''}<div class="info small"><b>Huomio:</b> Valmistunut ja todennettu toimi näkyy Todennetut-näkymässä. Tavoitetila huomioi myös suunnitellut toimet. Pelkkä palautumisajan lyhentäminen näkyy alla olevassa taulukossa; se ei automaattisesti muuta matriisin vakavuusluokkaa.</div>`}
function actionComparison(){return `<div class="card"><h2>Riskikohtaiset muutokset ja palautuminen</h2><p class="small muted">Vertailu päivittyy, kun muokkaat toimenpidettä. Riskitunnisteet ovat samat kaikissa kolmessa riskimatriisin näkymässä. Resurssiin kohdistettu toimenpide huomioidaan kaikissa siihen riippuvissa toiminnoissa.</p>${riskImpactTable()}<p class="small muted">Matriisin pisteiden summa on vain havainnollistava vertailuindeksi, ei rahallinen vahinkoennuste. Sama resurssihäiriö voi vaikuttaa useaan toimintoon; pisteitä ei tule tulkita erillisiksi vahingoiksi.</p></div>`}
function pageActions(){const a=action(ui.selectedAction)||db.actions[0];if(a)ui.selectedAction=a.id;const rank={'Heti':0,'Seuraavaksi':1,'Myöhemmin':2};const sorted=[...db.actions].sort((x,y)=>ui.sortActions==='status'?String(x.status).localeCompare(y.status,'fi'):ui.sortActions==='cost'?((x.cost===''?Infinity:Number(x.cost||0))-(y.cost===''?Infinity:Number(y.cost||0))):rank[x.priority]-rank[y.priority]);return `${guide()}<div class="card"><div class="toolbar space"><div><h2>5. Kehittämistoimenpiteet</h2><p class="muted small">Sopikaa, mitä tehdään, kuka tekee ja mihin mennessä. Toimenpiteen voi kohdistaa riskiin tai kaikille yhteistä resurssia käyttäville toiminnoille.</p></div><button class="btn" id="addAction">+ Lisää toimenpide</button></div><div class="toolbar" style="margin-bottom:12px">${form('Järjestä',`<select id="actionSort">${options(ui.sortActions,[['priority','Kiireellisyys'],['status','Tila'],['cost','Kustannus']])}</select>`)}</div><div class="tablewrap"><table><thead><tr><th>Toimenpide</th><th>Kiireellisyys</th><th>Vastuu</th><th>Tavoite</th><th>Tila</th><th></th></tr></thead><tbody>${sorted.map(x=>`<tr class="clickable ${x.id===ui.selectedAction?'selected':''}" data-select-action="${x.id}"><td><strong>${esc(x.title)}</strong></td><td>${esc(x.priority)}</td><td>${esc(x.owner||'Avoin')}</td><td>${esc(x.due||'Avoin')}</td><td>${esc(x.status)} ${x.verified?'✓':''}</td><td><button class="btn smallbtn secondary" data-select-action="${x.id}">Muokkaa</button></td></tr>`).join('')}</tbody></table></div></div><div class="workshop-workbench"><div class="workshop-editor">${a?`<div class="card"><div class="toolbar space"><h2>Muokkaa toimenpidettä</h2><button class="btn danger smallbtn" id="deleteAction">Poista toimenpide</button></div>${form('Toimenpiteen nimi',inp('action',a.id,'title',a.title))}<div class="grid two">${form('Vastuuhenkilö',inp('action',a.id,'owner',a.owner))}${form('Tavoitepäivä',inp('action',a.id,'due',a.due,'date'))}${form('Kiireellisyys',sel('action',a.id,'priority',a.priority,[['Heti','Heti'],['Seuraavaksi','Seuraavaksi'],['Myöhemmin','Myöhemmin']]))}${form('Toteutuksen tila',sel('action',a.id,'status',a.status,[['Suunniteltu','Suunniteltu'],['Käynnissä','Käynnissä'],['Valmis','Valmis']]))}${form('Vaikutuksen mekanismi',sel('action',a.id,'mechanism',a.mechanism,[['impact','Pienentää keskeytyksen vaikutusta'],['likelihood','Pienentää tapahtuman todennäköisyyttä'],['recovery','Lyhentää palautumisaikaa']]))}${form('Arvioitu vaikutus (%)',inp('action',a.id,'reduction',a.reduction,'number','min="0" max="100"'))}${form('Kustannusarvio (€), valinnainen',inp('action',a.id,'cost',a.cost,'number','min="0"'))}</div>${form('Toimenpiteen tarkempi kuvaus',ta('action',a.id,'description',a.description,2))}<div class="divider"></div><h3>Vaikutuksen kohdistus</h3>${form('Kohdistuuko toimi yhteiseen resurssiin?',sel('action',a.id,'resource',a.resource,[['','Ei – valittuihin keskeytysskenaarioihin'],...listRes().map(r=>[r,'Yhteinen resurssi: '+r])]))}${!a.resource?`<div class="chips">${db.risks.map(r=>`<label class="chip checkbox"><input type="checkbox" data-risk-assignment="${a.id}" data-rid="${r.id}" ${(a.riskIds||[]).includes(r.id)?'checked':''}> ${riskCode(r)} ${esc(r.event)}</label>`).join('')}</div>`:`<div class="info"><b>${esc(a.resource)}</b> vaikuttaa automaattisesti seuraaviin toimintoihin: ${db.functions.filter(f=>f.deps.includes(a.resource)).map(f=>esc(f.name)).join(', ')||'Ei yhdistettyjä toimintoja'}.</div>`}<div class="field" style="margin-top:13px"><label class="checkbox"><input type="checkbox" data-kind="action" data-id="${a.id}" data-key="verified" ${a.verified?'checked':''}> Vaikutus on todennettu harjoituksella, mittauksella tai muulla näytöllä</label><span class="field-hint">Vain Valmis + todennettu vaikuttaa ”Todennetut toimet” -näkymään. Suunnitellut toimet näkyvät tavoitetilassa.</span></div><div class="info">Arvioitu vaikutus esitetään demossa laskennallisena muutoksena todennäköisyyteen, vaikutu  const funcs=db.functions.map((f,i)=>{const rs=risksByFn(f.id),as=actionsForFn(f),unassessed=(f.deps||[]).filter(d=>!rs.some(r=>r.resource===d));return `<section class="plan-func"><h3>${i+1}. ${esc(f.name)}</h3><p><b>Kriittisyys:</b> ${esc(f.critical)}/5 · <b>RTO:</b> ${esc(f.rto)} h · <b>Haitta 4 / 24 / 72 tunnissa:</b> ${esc(f.impact4)} / ${esc(f.impact24)} / ${esc(f.impact72)} (1–5)</p><p><b>Toiminnon kuvaus ja jatkuvuuden erityispiirteet:</b> ${planVal(f.note,'toiminnon omistaja, palvelutaso ja muut huomioitavat asiat')}</p><p><b>Resurssiriippuvuudet:</b> ${(f.deps||[]).length?f.deps.map(d=>`<span class="plan-chip">${esc(d)}</span>`).join(''):planPlaceholder('toiminnon riippuvuudet')}</p><p><b>Tunnistetut keskeytysskenaariot:</b> ${rs.length?rs.map(r=>`<span class="plan-chip">${riskCode(r)} – ${esc(r.event)}</span>`).join(''):planPlaceholder('tämän toiminnon keskeytysskenaariot')}</p>${unassessed.length?`<p class="plan-small"><b>Riippuvuudet ilman omaa arvioitua skenaariota:</b> ${esc(unassessed.join(', '))}. Tämä ei tarkoita, että niihin liittyvät riskit olisi arvioitu vähäisiksi.</p>`:''}<table class="plan-table-2"><tbody><tr><td>Toiminnosta vastaava / varahenkilö</td><td>${planPlaceholder('nimet ja tavoitettavuus')}</td></tr><tr><td>Toiminnan vähimmäistaso häiriössä</td><td>${planPlaceholder('vähimmäiskapasiteetti ja tärkeimmät toimitukset')}</td></tr><tr><td>Toiminnon varamenettelyt</td><td>${planPlaceholder('käytännössä testattu toimintatapa, resurssit ja rajoitteet')}</td></tr><tr><td>Palautumisen työjärjestys</td><td>${planPlaceholder('vaiheet, edellytykset ja hyväksyntä')}</td></tr></tbody></table><p><b>Tähän toimintoon kohdistuvat kehittämistoimet:</b></p><ul>${planList(as.map(a=>`<b>${esc(a.title)}</b> – ${esc(a.status||'Avoin')}; vastuu: ${planVal(a.owner,'vastuuhenkilö')}; tavoite: ${planVal(a.due,'päivämäärä')}. ${a.description?esc(a.description):''}`),'jatkuvuutta parantavat toimenpiteet')}</ul></section>`}).join('');
 const actions=db.actions.map(a=>`<tr><td>${esc(a.title||'Nimeämätön toimenpide')}<div class="plan-small">${esc(a.description||'Kuvausta ei ole kirjattu.')}</div></td><td>${esc(a.resource||((a.riskIds||[]).map(id=>risk(id)?riskCode(risk(id)):'').filter(Boolean).join(', ')||'Kohdistus avoin'))}</td><td>${planVal(a.owner,'vastuu')} / ${planVal(a.due,'aikataulu')}</td><td>${esc(a.status||'Avoin')}${a.verified?' (vaikutus todennettu)':''}</td></tr>`).join('');

 <h2>7. Avoimet asiat ja hyväksyntä</h2><ul>${planList(followups.map(x=>esc(x)),'kootut avoimet kysymykset ja vahvistusta edellyttävät kohdat')}</ul><p><b>Työpajan yhteiset johtopäätökset:</b> ${planVal(db.workshop.conclusions,'keskeiset havainnot ja päätökset')}</p><p><b>Suunnitelman hyväksyntä:</b> ${planPlaceholder('hyväksyjä, päivämäärä, versio ja seuraava päivitys')}</p><p class="plan-small">Lähde: Jatkuvuus haltuun -työpajan tallennetut tiedot. Laskennallisia riippuvuusskenaarioita ei ole esitetty vahvistettuina häiriötapahtumina. Tiedot ja mallin oletukset on tarkistettava ennen suunnitelman hyväksyntää.</p></article>`;

  const matrixPdf=(mode,label)=>{check(266);text(LEFT,y,label,10.5,true,'#17394b');y+=22;const xs=LEFT+154,cw=67,rh=30;const lo={5:'Erittäin todennäköinen',4:'Todennäköinen',3:'Mahdollinen',2:'Epätodennäköinen',1:'Erittäin epätodennäk.'};text(xs+cw*1.2,y-4,'Vaikutuspiste',9,true);y+=14;for(let i=1;i<=5;i++)text(xs+(i-1)*cw+cw/2-3,y,String(i),8.5,true);y+=13;const marks={};for(const r of exposures()){const m=metrics(r,mode),k=m.p+':'+m.i;(marks[k]??=[]).push(riskCode(r))}for(let p=5;p>=1;p--){text(LEFT,y+20,`${p}  ${lo[p]}`,8.3,false);for(let imp=1;imp<=5;imp++){const intensity=p+imp,cl=intensity>=9?'#af5047':intensity>=7?'#eabd52':intensity>=5?'#f3e27c':intensity>=3?'#62cb84':'#b3e8bc',xx=xs+(imp-1)*cw;rect(xx,y,cw-2,rh-2,cl);const codes=(marks[p+':'+imp]||[]).join(', ');if(codes){const label=codes.length>24?codes.slice(0,23)+'…':codes;text(xx+4,y+19,label,9,true,'#123748')}}y+=rh}y+=19};
